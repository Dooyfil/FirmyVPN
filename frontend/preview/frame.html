<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>FirmyVPN — preview frame</title>
<style>
  html,body{margin:0;background:#02040a;height:100%;overflow:hidden}
  #wrap{width:1120px;height:740px;transform-origin:0 0}
  iframe{width:1120px;height:740px;border:0;display:block}
</style>
</head>
<body>
<div id="wrap"><iframe src="/"></iframe></div>
<script>
  // вписываем окно 1120x740 в текущий вьюпорт
  function fit() {
    const s = Math.min(window.innerWidth / 1120, window.innerHeight / 740)
    const w = document.getElementById('wrap')
    w.style.transform = 'scale(' + s + ')'
    w.style.left = ((window.innerWidth - 1120 * s) / 2) + 'px'
    w.style.top = ((window.innerHeight - 740 * s) / 2) + 'px'
    w.style.position = 'absolute'
  }
  fit()
  window.addEventListener('resize', fit)
</script>
</body>
</html>
