# XcodeGen: `xcodegen generate` превращает этот файл в FirmyVPN.xcodeproj
# (на GitHub это делает CI — .github/workflows/ios.yml). Параметры подписи —
# в Config/Signing.xcconfig.
name: FirmyVPN
options:
  bundleIdPrefix: com.firmyvpn
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES

targets:
  FirmyVPN:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        PRODUCT_NAME: FirmyVPN
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Go-рантайм (parse + ping) живёт и в приложении
        OTHER_LDFLAGS: "$(inherited) -lresolv -lz"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FirmyVPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        FirmyAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.firmyvpn.import
            CFBundleURLSchemes: [firmyvpn, vless, vmess, trojan, ss, hysteria2, hy2, tuic, anytls]
    entitlements:
      path: App/FirmyVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: libz.tbd
      - sdk: NetworkExtension.framework
      - sdk: UIKit.framework

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).PacketTunnel
        PRODUCT_NAME: PacketTunnel
        TARGETED_DEVICE_FAMILY: "1,2"
        # Go runtime внутри Libbox (sing-box)
        OTHER_LDFLAGS: "$(inherited) -lresolv -lz"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks @executable_path/Frameworks"
        SKIP_INSTALL: YES
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: FirmyVPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FirmyAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: libz.tbd
      - sdk: NetworkExtension.framework
      # sing-box powerreport (service/powerreport) использует UIDevice / UIApplication;
      # cgo LDFLAGS не переносятся внутрь статического фреймворка.
      - sdk: UIKit.framework

schemes:
  FirmyVPN:
    build:
      targets:
        FirmyVPN: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
