# FirmyVPN для iOS на макинах GitHub — Mac не нужен.
#
# Каждый push: ядро (Libbox.xcframework, кэшируется) → XcodeGen → архив без
# подписи → готовый FirmyVPN-unsigned.ipa артефактом. Ничего не подписано,
# секреты не нужны. Подписываете IPA своим сертификатом (ESign / Feather /
# Scarlet / zsign) и ставите на iPhone.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать IPA в релизах"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ---------- Ядро: gomobile bind → Libbox.xcframework ----------
  cores:
    name: Ядро (Libbox.xcframework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # сверяется с локальной сборкой (проверено на Go 1.27.x)
          go-version: stable
          cache-dependency-path: ios/core/go.sum

      - name: Кэш Go
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-cores-${{ hashFiles('ios/core/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-cores-

      - name: gomobile bind (sing-box + firmycore)
        run: PLATFORMS=ios bash ios/scripts/build-libbox.sh

      - name: Размер фреймворка
        run: du -sh ios/Frameworks/Libbox.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: Libbox.xcframework
          path: ios/Frameworks
          retention-days: 1

  # ---------- Приложение: XcodeGen → архив → unsigned IPA ----------
  ipa:
    name: Сборка IPA
    needs: cores
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Libbox.xcframework
          path: ios/Frameworks

      - name: XcodeGen
        run: |
          set -e
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
          cd ios && xcodegen generate
          ls -la FirmyVPN.xcodeproj/project.pbxproj

      - name: Архив без подписи (информация об ошибке -> бранч ci-debug)
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          xcodebuild \
            -project FirmyVPN.xcodeproj \
            -scheme FirmyVPN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FirmyVPN.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee ci-archive.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ci_exit.txt
          echo "XCODEBUILD_EXIT=$rc"
          echo "== archive dir =="
          ls -d build/FirmyVPN.xcarchive 2>/dev/null || echo "NO ARCHIVE DIR"
          if [ "$rc" != "0" ]; then
            git config user.email "ci@firmyvpn"; git config user.name "FirmyVPN CI"
            git add ci-archive.log ci_exit.txt 2>/dev/null
            git commit -m "ci debug: archive rc=$rc" -q 2>/dev/null
            git push --force https://x-access-token:$GH_TOKEN@github.com/Dooyfil/FirmyVPN.git HEAD:ci-debug-archive 2>&1 | tail -2
          fi

      - name: Сборка .ipa (Payload/)
        working-directory: ios
        run: |
          set -e
          rm -rf Payload FirmyVPN-unsigned.ipa
          mkdir -p Payload
          echo "== apps in Products/Applications =="
          ls -d build/FirmyVPN.xcarchive/Products/Applications/*.app
          APP=$(ls -d build/FirmyVPN.xcarchive/Products/Applications/*.app | head -1)
          [ -n "$APP" ] || { echo "ERROR: no .app found"; exit 1; }
          cp -R "$APP" Payload/
          ls Payload/
          zip -qr FirmyVPN-unsigned.ipa Payload
          echo "== ipa built =="
          ls -la FirmyVPN-unsigned.ipa
          du -sh Payload/FirmyVPN.app

      - uses: actions/upload-artifact@v4
        with:
          name: FirmyVPN-unsigned
          path: ios/FirmyVPN-unsigned.ipa
          retention-days: 30

      - name: Опубликовать в релизах — Айфон-версия
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios
        run: |
          # переименование собранного файла под название айфон-версии
          if [ -f FirmyVPN-unsigned.ipa ]; then mv -f FirmyVPN-unsigned.ipa FirmyVPN-iPhone-version.ipa; fi
          ls -la FirmyVPN-iPhone-version.ipa 2>/dev/null || ls -la FirmyVPN-unsigned.ipa
          if gh release view ios-unsigned >/dev/null 2>&1; then
            gh release edit ios-unsigned --title "FirmyVPN — Айфон-версия (unsigned IPA)" \
              --notes "Айфон-версия VPN (FirmyVPN) — это версия для iPhone. Подпишите IPA своим Apple-сертификатом (ESign, Feather, Scarlet, zsign) и установите на iPhone." 2>/dev/null || true
            gh release delete-asset ios-unsigned FirmyVPN-unsigned.ipa --yes 2>/dev/null || true
            gh release upload ios-unsigned FirmyVPN-iPhone-version.ipa --clobber
          else
            gh release create ios-unsigned FirmyVPN-iPhone-version.ipa \
              --title "FirmyVPN — Айфон-версия (unsigned IPA)" \
              --notes "Айфон-версия VPN (FirmyVPN) — это версия для iPhone. Подпишите IPA своим Apple-сертификатом (ESign, Feather, Scarlet, zsign) и установите на iPhone."
          fi
          echo "iOS release ready"

      - name: Релиз ПК-версии (установщик)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          SHA=$(shasum -a 256 installer/FirmyVPN-Setup.exe 2>/dev/null | awk '{print $1}')
          [ -n "$SHA" ] || SHA="н/д"
          if gh release view pc-version >/dev/null 2>&1; then
            gh release edit pc-version --title "FirmyVPN — ПК-версия (установщик)" --notes "ПК-версия VPN — установщик FirmyVPN-Setup.exe (SHA256: $SHA)." 2>/dev/null || true
            gh release upload pc-version installer/FirmyVPN-Setup.exe --clobber
          else
            gh release create pc-version installer/FirmyVPN-Setup.exe \
              --title "FirmyVPN — ПК-версия (установщик)" \
              --notes "ПК-версия VPN — установщик FirmyVPN-Setup.exe (собран Inno Setup 6). SHA256: $SHA."
          fi
